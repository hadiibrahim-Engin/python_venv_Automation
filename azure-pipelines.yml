# =============================================================================
# azure-pipelines.yml - Validate / Build / Publish for PythonVenvAutomation
# =============================================================================
variables:
  PSRepositoryName: 'CompanyPS'
  PSRepositoryUri: 'https://pkgs.dev.azure.com/REPLACE_ORG/REPLACE_PROJECT/_packaging/REPLACE_FEED/nuget/v3/index.json'

trigger:
  branches:
    include:
      - main
      - '*'
  tags:
    include:
      - 'v*'

pr:
  branches:
    include:
      - '*'

pool:
  vmImage: 'windows-latest'

stages:
  - stage: Validate
    displayName: Validate
    jobs:
      - job: validate
        displayName: Pester + coverage
        steps:
          - task: PowerShell@2
            displayName: Ensure tooling (PSResourceGet + Pester)
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                if (-not (Get-Command Install-PSResource -ErrorAction SilentlyContinue)) {
                  Install-Module Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -AllowClobber
                }
                if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0')) {
                  Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck
                }
          - task: PowerShell@2
            displayName: Run Pester + 70% coverage gate
            inputs:
              targetType: inline
              pwsh: true
              script: ./Run-Tests.ps1 -MinimumCoverage 70
          - task: PublishTestResults@2
            displayName: Publish Pester results
            condition: always()
            inputs:
              testResultsFormat: NUnit
              testResultsFiles: 'test-results.xml'
              failTaskOnFailedTests: true

  - stage: Build
    displayName: Build
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: build
        displayName: Package module
        steps:
          - task: PowerShell@2
            displayName: Build package
            inputs:
              targetType: inline
              pwsh: true
              script: ./build/Build.ps1
          - publish: artifacts
            artifact: PythonVenvAutomation
          - publish: install.ps1
            artifact: installer

  - stage: Publish
    displayName: Publish
    dependsOn: Build
    condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/tags/v'))
    jobs:
      - job: publish
        displayName: Publish to Azure Artifacts
        steps:
          - download: current
            artifact: PythonVenvAutomation
          - task: PowerShell@2
            displayName: Publish module package
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'
                if (-not (Get-Command Install-PSResource -ErrorAction SilentlyContinue)) {
                  Install-Module Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -AllowClobber
                }
                ./build/Build.ps1 | Out-Null
                ./build/Publish.ps1 -RepositoryName "$(PSRepositoryName)" -RepositoryUri "$(PSRepositoryUri)" -ApiKey "$(NUGET_API_KEY)"
            env:
              NUGET_API_KEY: $(NUGET_API_KEY)
