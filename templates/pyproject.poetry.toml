# =============================================================================
# pyproject.toml template for Poetry usage
#
# Use this when the project should be managed by Poetry.
#
# Setup auto-detection signals:
#   - build-backend is poetry.core.masonry.api
#   - [tool.poetry] is present
#   - [tool.uv] is absent
#
# To use:
#   1. Copy this file to your project root as pyproject.toml.
#   2. Edit name, description, dependencies, and Python range.
#   3. Delete .setup-config.json if a package manager was previously cached.
#   4. Run .\scripts4PythonAutomation\setup-core.ps1 -PackageManager auto
# =============================================================================

[tool.poetry]
name = "your-project-name"
version = "0.1.0"
description = "Short project description."
authors = ["Your Name <you@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
requests = ">=2.31"
rich = ">=13.0"
# Azure DevOps / private Git dependency — branch-ref, pinned to latest 'main' commit.
# Poetry pins the exact commit in poetry.lock on first install.
# To pull the latest commit from 'main': -UpgradePackage "my-lib"
#
# Authentication: store your PAT in Windows Credential Manager, or embed it:
#   git = "https://<user>:<pat>@dev.azure.com/<org>/<project>/_git/<repo>.git"
#
# my-lib = { git = "https://dev.azure.com/<org>/<project>/_git/<repo>.git", branch = "main" }

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"
ruff = ">=0.4"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
