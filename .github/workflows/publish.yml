# =============================================================================
# publish.yml - Validate / Build / Publish for PythonVenvAutomation (GitHub)
# =============================================================================
name: PythonVenvAutomation CI/CD

on:
  pull_request:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure tooling (PSResourceGet + Pester)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command Install-PSResource -ErrorAction SilentlyContinue)) {
            Install-Module Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -AllowClobber
          }
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0')) {
            Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
      - name: Run Pester + coverage gate
        shell: pwsh
        run: ./Run-Tests.ps1 -MinimumCoverage 70
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
          if-no-files-found: ignore

  build:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        shell: pwsh
        run: ./build/Build.ps1
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: PythonVenvAutomation
          path: artifacts/
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: install.ps1

  # NOTE: there is deliberately no publish-to-feed job here. DevSetup is
  # distributed from this repository's `distribution` branch (see
  # docs/DISTRIBUTION_ARCHITECTURE.md); a package feed is explicitly not an
  # end-user installation path. Azure Pipelines owns the release publish.
