# =============================================================================
# publish.yml - Validate / Build / Publish for PythonVenvAutomation (GitHub)
# -----------------------------------------------------------------------------
# - Pull requests        -> validate only.
# - Pushes to main       -> validate + build.
# - Version tags (v*)    -> validate + build + publish to GitHub Packages.
#
# Adapt by changing ONLY the env block below. The publish job authenticates with
# GITHUB_TOKEN (or a configured secret) and never prints it.
# =============================================================================
name: PythonVenvAutomation CI/CD

on:
  pull_request:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

env:
  PS_REPOSITORY_NAME: GitHubPackages
  PS_REPOSITORY_URI: https://nuget.pkg.github.com/REPLACE_OWNER/index.json

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure tooling (PSResourceGet + Pester)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command Install-PSResource -ErrorAction SilentlyContinue)) {
            Install-Module Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -AllowClobber
          }
          if (-not (Get-Module -ListAvailable Pester | Where-Object Version -ge '5.0')) {
            Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          }
      - name: Validate
        shell: pwsh
        run: ./build/Test.ps1

  build:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build package
        shell: pwsh
        run: ./build/Build.ps1
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: PythonVenvAutomation
          path: artifacts/
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: install.ps1

  publish:
    needs: build
    runs-on: windows-latest
    # Only publish for version tags (refs/tags/v*).
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write   # allow attaching install.ps1 to the GitHub Release
      packages: write   # allow publishing to GitHub Packages
    steps:
      - uses: actions/checkout@v4
      - name: Ensure tooling
        shell: pwsh
        run: |
          if (-not (Get-Command Install-PSResource -ErrorAction SilentlyContinue)) {
            Install-Module Microsoft.PowerShell.PSResourceGet -Scope CurrentUser -Force -AllowClobber
          }
      - name: Build + publish to GitHub Packages
        shell: pwsh
        env:
          # GITHUB_TOKEN is provided automatically and masked in logs. Swap for a
          # PAT secret if your org requires one for Packages.
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./build/Build.ps1 | Out-Null
          ./build/Publish.ps1 -RepositoryName $env:PS_REPOSITORY_NAME -RepositoryUri $env:PS_REPOSITORY_URI -ApiKey $env:NUGET_API_KEY
      - name: Attach install.ps1 to the release
        uses: softprops/action-gh-release@v2
        with:
          files: install.ps1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
